<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Bar: Tabs & Pin Button -->
    <header id="app-header">
        <div id="tabs-container">
            <div id="tabs-list"></div>
            <button id="btn-add-tab" title="Thêm tab mới (Ctrl+N)">+</button>
        </div>
        <div id="header-actions">
            <button id="btn-pin" class="action-btn" title="Ghim luôn trên cùng (Always on Top)">📌</button>
        </div>
    </header>

    <!-- Editor Container -->
    <main id="editor-container">
        <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="Gõ nội dung ở đây... (Gõ [] để tạo việc cần làm, Ctrl+V để dán ảnh)"></div>
    </main>

    <!-- Modal Rename Tab -->
    <div id="rename-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Đổi tên tab</h3>
            <input type="text" id="rename-input" placeholder="Nhập tên mới...">
            <div class="modal-actions">
                <button id="btn-cancel-rename" class="btn-secondary">Hủy</button>
                <button id="btn-confirm-rename" class="btn-primary">Lưu</button>
            </div>
        </div>
    </div>

    <script src="editor.js"></script>
</body>
</html>
