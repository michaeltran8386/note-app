<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Bar: Tabs & Pin Button -->
    <header id="app-header">
        <div id="tabs-container">
            <div id="tabs-list"></div>
            <button id="btn-add-tab" title="Thêm tab mới (Ctrl+N)">+</button>
        </div>
        <div id="header-actions">
            <button id="btn-pin" class="action-btn" title="Ghim luôn trên cùng (Always on Top)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pin pin-icon">
                    <path d="M12 17v5"/>
                    <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Editor Container -->
    <main id="editor-container">
        <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="Gõ nội dung ở đây... (Gõ [] để tạo việc cần làm, Ctrl+V để dán ảnh)"></div>
    </main>

    <!-- Modal Rename Tab -->
    <div id="rename-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Đổi tên tab</h3>
            <input type="text" id="rename-input" placeholder="Nhập tên mới...">
            <div class="modal-actions">
                <button id="btn-cancel-rename" class="btn-secondary">Hủy</button>
                <button id="btn-confirm-rename" class="btn-primary">Lưu</button>
            </div>
        </div>
    </div>

    <script src="editor.js"></script>
</body>
</html>
