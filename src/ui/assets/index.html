<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Ultra-Minimal Header -->
    <header id="app-header">
        <div id="tabs-container">
            <div id="tabs-list"></div>
            <button id="btn-add-tab" title="Thêm tab mới (Ctrl+N)">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>
        <div id="header-actions">
            <button id="btn-pin" class="action-btn" title="Ghim cửa sổ (Always on Top)">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pin pin-icon">
                    <path d="M12 17v5"/>
                    <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Ultra-Minimal Editor -->
    <main id="editor-container">
        <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="Viết ghi chú... (gõ [] để tạo việc cần làm, dán ảnh Ctrl+V)"></div>
    </main>

    <!-- Minimal Rename Modal -->
    <div id="rename-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <input type="text" id="rename-input" placeholder="Tên tab mới...">
            <div class="modal-actions">
                <button id="btn-cancel-rename" class="btn-text">Hủy</button>
                <button id="btn-confirm-rename" class="btn-accent">Lưu</button>
            </div>
        </div>
    </div>

    <script src="editor.js"></script>
</body>
</html>
