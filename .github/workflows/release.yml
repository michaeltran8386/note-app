name: Release NoteLocal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build NoteLocal (Release)
        run: cmake --build build

      - name: Run Native C++ Tests
        run: ctest --test-dir build --output-on-failure

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run E2E Editor Regression Tests
        run: node tests/editor_interactions.mjs

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer Package
        run: iscc installer.iss

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NoteLocal-Setup-x64.exe
          name: NoteLocal ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
