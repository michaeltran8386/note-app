name: Release NoteLocal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release'
        required: false
        default: 'v3.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download and unpack WebView2 SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40" -OutFile webview2.zip
          Expand-Archive -Path webview2.zip -DestinationPath third_party/webview2 -Force
          Remove-Item webview2.zip

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build NoteLocal (Release)
        run: cmake --build build

      - name: Run Native C++ Tests
        run: ctest --test-dir build --output-on-failure

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run E2E Editor Regression Tests
        run: node tests/editor_interactions.mjs

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer Package
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            & "$env:LocalAppData\Programs\Inno Setup 6\ISCC.exe" installer.iss
          }

      - name: Build Portable Zip Package
        shell: pwsh
        run: |
          $staging = "dist/portable/NoteLocal"
          New-Item -ItemType Directory -Path "$staging/src/ui/assets" -Force
          New-Item -ItemType Directory -Path "$staging/resources" -Force
          Copy-Item "build/bin/NoteLocal.exe" "$staging/"
          if (Test-Path "build/bin/WebView2Loader.dll") {
            Copy-Item "build/bin/WebView2Loader.dll" "$staging/"
          }
          Copy-Item "src/ui/assets/*" "$staging/src/ui/assets" -Recurse
          Copy-Item "resources/app.ico" "$staging/resources/"
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/NoteLocal-portable-x64.zip" -Force

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/NoteLocal-Setup-x64.exe
            dist/NoteLocal-portable-x64.zip
          name: NoteLocal ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
