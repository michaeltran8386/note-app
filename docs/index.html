<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Local - Clean Text Viewer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Trình đọc và ghi chú Clean Text tối giản, không cần máy chủ, mã hóa toàn bộ dữ liệu trực tiếp trong URL.">
    <link rel="stylesheet" href="style.css?v=2.8">
</head>
<body>
    <header id="site-header">
        <div class="header-left">
            <a href="./" class="brand" title="Note Local">
                <img src="logo.svg" alt="Note Local" width="22" height="22">
                <span class="brand-name">Note Local</span>
            </a>
            <span class="separator">/</span>
            <span id="doc-title" class="doc-title">Clean Text</span>
        </div>
        <div class="header-actions">
            <!-- Chế độ xem / Chỉnh sửa -->
            <button id="btn-toggle-mode" class="nav-btn" title="Chuyển chế độ Xem / Soạn thảo">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-edit-3">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                </svg>
                <span class="btn-label">Soạn thảo</span>
            </button>
            <!-- Sao chép văn bản thô -->
            <button id="btn-copy-raw" class="nav-btn" title="Sao chép nội dung Markdown">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy">
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
                <span class="btn-label">Sao chép</span>
            </button>
            <!-- Sao chép URL -->
            <button id="btn-share" class="nav-btn" title="Sao chép URL chia sẻ">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-share-2">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                <span class="btn-label">Chia sẻ</span>
            </button>
            <!-- GitHub Repo Link -->
            <a href="https://github.com/michaeltran8386/note-app" target="_blank" rel="noopener noreferrer" class="nav-btn icon-only" title="Xem mã nguồn trên GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-github">
                    <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
                    <path d="M9 18c-4.51 2-5-2-7-2"/>
                </svg>
            </a>
        </div>
    </header>

    <main id="app-container">
        <!-- Chế độ Xem (Rendered Clean Text) -->
        <article id="display" class="markdown-body"></article>

        <!-- Chế độ Soạn thảo (Textarea) -->
        <textarea id="editor" class="raw-editor hidden" spellcheck="false" placeholder="Nhập ghi chú của bạn ở đây... (Cú pháp [] tự tạo To-Do checkbox, cú pháp - tạo gạch đầu dòng, định dạng Markdown)"></textarea>
    </main>

    <!-- Share Modal -->
    <div id="share-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="share-modal-title">Chia sẻ ghi chú</h3>
                <button id="btn-close-share-modal" class="icon-btn-close" title="Đóng (Esc)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"/>
                        <path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p id="share-modal-desc" class="modal-desc">Đường link này chứa 100% nội dung ghi chú (Serverless). Người nhận mở ra là xem và chỉnh sửa được ngay mà không cần tài khoản hay cấu hình máy chủ.</p>
                <div class="share-url-group">
                    <input type="text" id="share-modal-url" class="share-input" readonly placeholder="Đang tạo link...">
                    <button type="button" id="btn-copy-modal-url" class="btn-primary">Sao chép</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js?v=2.8"></script>
</body>
</html>
